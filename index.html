<style>
  html { -webkit-tap-highlight-color: transparent; }
  body { font-family: Inter, system-ui, sans-serif; }
  .lbl { display:block; font-size:.8rem; font-weight:600; color:#334155; margin-bottom:.35rem; }
  .inp { width:100%; border:1px solid #cbd5e1; border-radius:.65rem; padding:.65rem .8rem; font-size:16px; background:#fff; color:#0f172a; outline:none; transition:border-color .15s, box-shadow .15s; }
  .inp:focus { border-color:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.25); }
  textarea.inp { resize:vertical; min-height:84px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:.45rem; border-radius:.65rem; font-weight:600; font-size:.875rem; padding:.6rem 1rem; transition:background .15s, transform .05s; white-space:nowrap; }
  .btn:active { transform:scale(.98); }
  .btn-primary { background:#f59e0b; color:#1e293b; }
  .btn-primary:hover { background:#d97706; color:#fff; }
  .btn-navy { background:#1e293b; color:#fff; }
  .btn-navy:hover { background:#334155; }
  .btn-ghost { background:#f1f5f9; color:#1e293b; }
  .btn-ghost:hover { background:#e2e8f0; }
  .btn-danger { background:#fee2e2; color:#b91c1c; }
  .btn-danger:hover { background:#fecaca; }
  .icon-btn { display:inline-flex; align-items:center; justify-content:center; width:2.25rem; height:2.25rem; border-radius:.6rem; color:#475569; }
  .icon-btn:hover { background:#f1f5f9; color:#1e293b; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:1rem; box-shadow:0 1px 2px rgba(15,23,42,.04); }
  .chip { display:inline-flex; align-items:center; gap:.35rem; padding:.4rem .8rem; border-radius:999px; font-size:.8rem; font-weight:600; border:1px solid #e2e8f0; background:#fff; color:#334155; white-space:nowrap; }
  .chip.active { background:#1e293b; color:#fff; border-color:#1e293b; }
  .badge { display:inline-flex; align-items:center; gap:.25rem; padding:.15rem .55rem; border-radius:999px; font-size:.7rem; font-weight:700; line-height:1.4; white-space:nowrap; }
  .no-scrollbar::-webkit-scrollbar { display:none; } .no-scrollbar { scrollbar-width:none; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
  .fade-in { animation: fade .18s ease-out; } @keyframes fade { from { opacity:0; transform:translateY(6px);} to {opacity:1; transform:none;} }
  input[type=range] { accent-color:#f59e0b; }
  .seg input { display:none; }
  .seg label { flex:1; text-align:center; padding:.6rem; border-radius:.55rem; font-weight:600; font-size:.875rem; cursor:pointer; color:#475569; }
  .seg input:checked + label.in { background:#dcfce7; color:#15803d; }
  .seg input:checked + label.out { background:#fee2e2; color:#b91c1c; }
  #print-area { display:none; }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background:#fff !important; }
    #app, #modal, #confirm, #lightbox, #toast { display:none !important; }
    #print-area { display:block !important; color:#0f172a; font-size:11px; }
    #print-area table { width:100%; border-collapse:collapse; margin-bottom:14px; }
    #print-area th, #print-area td { border:1px solid #cbd5e1; padding:4px 6px; text-align:left; vertical-align:top; }
    #print-area th { background:#f1f5f9 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    #print-area h2 { font-size:14px; font-weight:700; margin:16px 0 6px; border-bottom:2px solid #f59e0b; padding-bottom:3px; }

<body class="bg-slate-100 text-slate-800 antialiased">

<div id="app" class="min-h-screen pb-24 md:pb-10">
  <!-- Header -->
  <header class="bg-navy text-white sticky top-0 z-30 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-brand flex items-center justify-center shrink-0">
        <svg viewBox="0 0 24 24" class="w-6 h-6 text-navy" fill="currentColor"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>
      </div>
      <div class="min-w-0 flex-1">
        <h1 id="hdr-name" class="font-bold leading-tight truncate">Proyek Rumah</h1>
        <p id="hdr-sub" class="text-xs text-slate-300 truncate"></p>
      </div>
      <button data-act="print" class="hidden sm:inline-flex btn bg-white/10 hover:bg-white/20 text-white"><span data-icon="printer"></span>Cetak Laporan</button>
      <div class="relative">
        <button data-act="menu" class="icon-btn text-white hover:bg-white/10 hover:text-white" aria-label="Menu"><span data-icon="dots"></span></button>
        <div id="menu" class="hidden absolute right-0 mt-2 w-64 bg-white text-slate-700 rounded-xl shadow-2xl border border-slate-200 py-2 z-40 fade-in">
          <button data-act="settings" class="menu-item"><span data-icon="cog"></span>Pengaturan Proyek</button>
          <button data-act="print" class="menu-item"><span data-icon="printer"></span>Cetak / Simpan PDF</button>
          <button data-act="csv" class="menu-item"><span data-icon="download"></span>Ekspor Keuangan (CSV/Excel)</button>
          <div class="my-1 border-t border-slate-100"></div>
          <button data-act="backup" class="menu-item"><span data-icon="download"></span>Backup Data (JSON)</button>
          <button data-act="restore" class="menu-item"><span data-icon="upload"></span>Pulihkan dari Backup</button>
          <div class="my-1 border-t border-slate-100"></div>
          <button data-act="load-demo" class="menu-item"><span data-icon="refresh"></span>Muat Ulang Data Contoh</button>
          <button data-act="wipe" class="menu-item text-red-600"><span data-icon="trash"></span>Hapus Semua Data</button>
        </div>
      </div>
    </div>
    <!-- Desktop tabs -->
    <nav class="hidden md:block border-t border-white/10">
      <div class="max-w-6xl mx-auto px-4 flex gap-1" id="tabs-desktop"></div>
    </nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 pt-5">
    <section id="tab-dashboard" data-tab="dashboard"></section>
    <section id="tab-absensi" data-tab="absensi" class="hidden"></section>
    <section id="tab-progress" data-tab="progress" class="hidden"></section>
    <section id="tab-keuangan" data-tab="keuangan" class="hidden"></section>
  </main>

  <!-- Mobile FAB -->
  <button id="fab" data-act="fab" class="md:hidden fixed right-4 bottom-24 z-30 w-14 h-14 rounded-full bg-brand text-navy shadow-xl flex items-center justify-center hidden" aria-label="Tambah"><span data-icon="plus" data-size="7"></span></button>

  <!-- Mobile bottom nav -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 safe-bottom">
    <div class="grid grid-cols-4" id="tabs-mobile"></div>
  </nav>
</div>

<!-- Generic modal (form / detail) -->
<div id="modal" class="hidden fixed inset-0 z-40">
  <div class="absolute inset-0 bg-navy-900/60 backdrop-blur-sm" data-act="close-modal"></div>
  <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center sm:p-4 pointer-events-none">
    <div id="modal-panel" class="pointer-events-auto bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl max-h-[92vh] flex flex-col fade-in">
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <h3 id="modal-title" class="font-bold text-navy text-lg"></h3>
        <button data-act="close-modal" class="icon-btn" aria-label="Tutup"><span data-icon="x"></span></button>
      </div>
      <div id="modal-body" class="px-5 py-4 overflow-y-auto safe-bottom"></div>
    </div>
  </div>
</div>

<!-- Confirm dialog -->
<div id="confirm" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
  <div class="absolute inset-0 bg-navy-900/60" data-act="confirm-no"></div>
  <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 fade-in">
    <div class="w-11 h-11 rounded-full bg-red-100 text-red-600 flex items-center justify-center mb-3"><span data-icon="trash"></span></div>
    <h4 id="confirm-title" class="font-bold text-navy text-lg mb-1">Hapus data?</h4>
    <p id="confirm-msg" class="text-sm text-slate-600 mb-5"></p>
    <div class="flex gap-2 justify-end">
      <button data-act="confirm-no" class="btn btn-ghost">Batal</button>
      <button data-act="confirm-yes" id="confirm-yes" class="btn bg-red-600 hover:bg-red-700 text-white">Hapus</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="hidden fixed inset-0 z-[60] bg-black/95 text-white flex flex-col">
  <div class="flex items-center justify-between px-4 h-14 shrink-0">
    <span id="lb-count" class="text-sm text-slate-300"></span>
    <div class="flex items-center gap-1">
      <div id="lb-actions" class="flex gap-1"></div>
      <button data-act="lb-close" class="icon-btn text-white hover:bg-white/10 hover:text-white" aria-label="Tutup"><span data-icon="x"></span></button>
    </div>
  </div>
  <div class="relative flex-1 min-h-0 flex items-center justify-center px-2" id="lb-stage">
    <button data-act="lb-prev" id="lb-prev" class="absolute left-2 sm:left-4 z-10 w-11 h-11 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center" aria-label="Sebelumnya"><span data-icon="chev-left"></span></button>
    <img id="lb-img" class="max-h-full max-w-full object-contain select-none rounded" alt="">
    <button data-act="lb-next" id="lb-next" class="absolute right-2 sm:right-4 z-10 w-11 h-11 rounded-full bg-white/10 hover:bg-white/25 flex items-center justify-center" aria-label="Berikutnya"><span data-icon="chev-right"></span></button>
  </div>
  <div id="lb-caption" class="shrink-0 px-5 py-4 text-sm max-w-3xl mx-auto w-full safe-bottom"></div>
</div>

<!-- Toast -->
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 md:bottom-8 z-[70] hidden"></div>

<input type="file" id="restore-input" accept="application/json,.json" class="hidden">
<div id="print-area"></div>

<script>
/* =========================================================
   Konstanta & util
   ========================================================= */
const LS_KEY = 'proyekRumah_v1';
const TAHAP = [
  { key:'Pembersihan Lahan',  w:5,  art:'lahan',     color:'bg-lime-100 text-lime-800',     bar:'#84cc16' },
  { key:'Fondasi',            w:15, art:'fondasi',   color:'bg-stone-200 text-stone-800',   bar:'#78716c' },
  { key:'Struktur Dinding',   w:25, art:'dinding',   color:'bg-orange-100 text-orange-800', bar:'#ea580c' },
  { key:'Atap',               w:20, art:'atap',      color:'bg-sky-100 text-sky-800',       bar:'#0284c7' },
  { key:'Plambing & Listrik', w:15, art:'plambing',  color:'bg-violet-100 text-violet-800', bar:'#7c3aed' },
  { key:'Finishing',          w:20, art:'finishing', color:'bg-emerald-100 text-emerald-800',bar:'#059669' },
];
const KAT_OUT = ['Material','Upah Borongan/Tukang','Alat Proyek','Operasional/Lain-lain'];
const KAT_IN  = ['Dana Pemilik','Pinjaman/KPR','Lainnya'];
const KAT_COLOR = {
  'Material':'bg-amber-100 text-amber-800', 'Upah Borongan/Tukang':'bg-blue-100 text-blue-800',
  'Alat Proyek':'bg-purple-100 text-purple-800', 'Operasional/Lain-lain':'bg-slate-200 text-slate-700',
  'Dana Pemilik':'bg-green-100 text-green-800', 'Pinjaman/KPR':'bg-teal-100 text-teal-800', 'Lainnya':'bg-slate-200 text-slate-700'
};
const KAT_BAR = { 'Material':'#f59e0b','Upah Borongan/Tukang':'#3b82f6','Alat Proyek':'#a855f7','Operasional/Lain-lain':'#64748b' };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const rp = n => 'Rp ' + Math.round(n || 0).toLocaleString('id-ID');
const rpSigned = n => (n < 0 ? '− ' : '') + rp(Math.abs(n));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const daysAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return ymd(d); };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtD = (s, opt = { day:'numeric', month:'short', year:'numeric' }) => s ? parseD(s).toLocaleDateString('id-ID', opt) : '-';
const fmtDLong = s => fmtD(s, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const byDateDesc = (a, b) => (b.date || '').localeCompare(a.date || '') || (b.createdAt || 0) - (a.createdAt || 0);
const tahapOf = k => TAHAP.find(t => t.key === k) || TAHAP[0];

/* ---------- Ikon ---------- */
const ICONS = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16.5 14.5c2.6.2 4.4 1.9 5 4.5"/>',
  camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  wallet:'<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7V6a2 2 0 0 1 2-2h11v3"/><circle cx="16.5" cy="13.5" r="1.2"/>',
  printer:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6 6 18"/>',
  trash:'<path d="M4 7h16"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  dots:'<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>',
  download:'<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/>',
  upload:'<path d="M12 16V5"/><path d="M7 10l5-5 5 5"/><path d="M4 20h16"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.3 4.9L20 16"/><path d="M20 20v-4h-4"/>',
  'chev-left':'<path d="M15 5l-7 7 7 7"/>', 'chev-right':'<path d="M9 5l7 7-7 7"/>',
  receipt:'<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  image:'<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
  arrowUp:'<path d="M12 19V5M6 11l6-6 6 6"/>', arrowDown:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  helmet:'<path d="M3 17h18"/><path d="M5 17a7 7 0 0 1 14 0"/><path d="M12 6v5"/>',
};
const icon = (n, size = 5, extra = '') => `<svg viewBox="0 0 24 24" class="w-${size} h-${size} shrink-0 ${extra}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;
function hydrateIcons(root = document) {
  root.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon, el.dataset.size || 5); });
}

/* =========================================================
   Foto contoh (SVG ilustrasi) untuk mock data
   ========================================================= */
const svgCache = {};
function mockSvg(kind, t1 = '', t2 = '') {
  const key = kind + '|' + t1 + '|' + t2;
  if (svgCache[key]) return svgCache[key];
  const x = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let art = '', label = '', sky = '#bae6fd', ground = '#a3a07a';
  const house = (wallTop, color = '#d6d3d1') => `<rect x='220' y='${wallTop}' width='360' height='${440 - wallTop}' fill='${color}'/>`;
  if (kind === 'lahan') {
    label = 'Pembersihan Lahan';
    art = `<ellipse cx='560' cy='440' rx='190' ry='45' fill='#92400e'/>` +
      [90,180,700].map(cx => `<rect x='${cx-8}' y='360' width='16' height='80' fill='#78350f'/><circle cx='${cx}' cy='340' r='55' fill='#4d7c0f'/>`).join('') +
      `<rect x='330' y='370' width='120' height='50' rx='8' fill='#f59e0b'/><rect x='420' y='340' width='40' height='40' fill='#1e293b'/><path d='M450 360 L530 300 L560 330' stroke='#f59e0b' stroke-width='14' fill='none'/><circle cx='350' cy='425' r='16' fill='#1e293b'/><circle cx='430' cy='425' r='16' fill='#1e293b'/>` +
      [250,290,610,650].map(px => `<rect x='${px}' y='395' width='6' height='45' fill='#fef3c7'/>`).join('');
  } else if (kind === 'fondasi') {
    label = 'Fondasi'; ground = '#a8a29e';
    art = `<rect x='80' y='430' width='640' height='70' fill='#57534e'/>` +
      Array.from({length: 16}, (_, i) => `<rect x='${90 + i*39}' y='${435 + (i%2)*12}' width='34' height='24' rx='6' fill='#d6d3d1'/>`).join('') +
      Array.from({length: 9}, (_, i) => `<rect x='${110 + i*72}' y='330' width='7' height='110' fill='#9a3412'/>`).join('') +
      `<rect x='100' y='350' width='600' height='5' fill='#9a3412'/><rect x='100' y='390' width='600' height='5' fill='#9a3412'/>`;
  } else if (kind === 'dinding') {
    label = 'Struktur Dinding';
    let bricks = '';
    for (let r = 0; r < 9; r++) for (let c = 0; c < 10; c++) {
      if (r > 6 && c > 6) continue;
      bricks += `<rect x='${170 + c*48 + (r%2)*24}' y='${410 - r*26}' width='44' height='22' fill='${(r+c)%3 ? '#c2410c' : '#ea580c'}'/>`;
    }
    art = `<rect x='160' y='190' width='16' height='250' fill='#9ca3af'/><rect x='640' y='190' width='16' height='250' fill='#9ca3af'/><rect x='160' y='180' width='496' height='14' fill='#9ca3af'/>` + bricks +
      `<rect x='380' y='300' width='80' height='140' fill='#1e293b' opacity='.85'/>`;

/* =========================================================
   Penyimpanan: data -> localStorage, foto -> IndexedDB
   (foto terlalu besar untuk kuota localStorage ±5 MB)
   ========================================================= */
const PhotoDB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('proyekRumah_foto', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('photos');
        r.onsuccess = () => { this.db = r.result; res(true); };
        r.onerror = () => res(false);
      } catch { res(false); }
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('photos', mode); const st = t.objectStore('photos');
      const out = fn(st); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error);
    });
  },
  put(k, v) { return this.tx('readwrite', st => { st.put(v, k); }); },
  del(k) { return this.tx('readwrite', st => { st.delete(k); }); },
  clear() { return this.tx('readwrite', st => { st.clear(); }); },
  all() {
    return new Promise((res, rej) => {
      const out = {}; const req = this.db.transaction('photos').objectStore('photos').openCursor();
      req.onsuccess = () => { const c = req.result; if (c) { out[c.key] = c.value; c.continue(); } else res(out); };
      req.onerror = () => rej(req.error);
    });
  }
};
const photoCache = {};

function photoSrc(ref) {
  if (!ref) return '';
  if (ref.startsWith('mock:')) { const [kind, a, b] = ref.slice(5).split('|'); return mockSvg(kind, a, b); }
  if (ref.startsWith('idb:')) return photoCache[ref.slice(4)] || '';
  return ref; // data URL inline (fallback)
}
async function storePhoto(dataUrl) {
  if (PhotoDB.db) {
    const id = uid();
    try { await PhotoDB.put(id, dataUrl); photoCache[id] = dataUrl; return 'idb:' + id; } catch (e) { console.warn(e); }
  }
  return dataUrl;
}
async function removePhoto(ref) {
  if (ref && ref.startsWith('idb:') && PhotoDB.db) { const id = ref.slice(4); delete photoCache[id]; try { await PhotoDB.del(id); } catch {} }
}
function compressImage(file, max = 1280, q = 0.72) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Format gambar tidak didukung')); };
    img.src = url;
  });
}

   ========================================================= */
function totals() {
  let masuk = 0, keluar = 0; const perKat = {};
  for (const f of state.finance) {
    if (f.type === 'in') masuk += +f.amount || 0;
    else { keluar += +f.amount || 0; perKat[f.category] = (perKat[f.category] || 0) + (+f.amount || 0); }
  }
  return { masuk, keluar, saldo: masuk - keluar, perKat };
}
function tahapProgress() {
  const latest = {};
  for (const p of [...state.progress].sort(byDateDesc)) if (!(p.category in latest)) latest[p.category] = +p.percent || 0;
  const list = TAHAP.map(t => ({ ...t, pct: latest[t.key] ?? 0 }));
  const overall = list.reduce((s, t) => s + t.w * t.pct / 100, 0) / TAHAP.reduce((s, t) => s + t.w, 0) * 100;
  return { list, overall };
}

let formPhoto = { ref: null, data: null, changed: false };
function photoField(label, ref, hint) {
  formPhoto = { ref, data: null, changed: false };
  const src = photoSrc(ref);
  return `<div><span class="lbl">${label}</span>
    <label for="photo-input" class="block cursor-pointer rounded-xl border-2 border-dashed border-slate-300 hover:border-brand bg-slate-50 overflow-hidden transition">
      <img id="photo-preview" src="${src}" class="${src ? '' : 'hidden'} w-full max-h-64 object-contain bg-slate-900" alt="">
      <div id="photo-empty" class="${src ? 'hidden' : ''} py-7 flex flex-col items-center text-slate-500 text-sm">
        <span class="w-12 h-12 rounded-full bg-brand-100 text-brand-700 flex items-center justify-center mb-2">${icon('camera', 6)}</span>
        <b class="text-navy">Ketuk untuk ambil foto / pilih dari galeri</b><span class="text-xs mt-0.5">${hint}</span></div>
    </label>
    <input type="file" id="photo-input" accept="image/*" class="hidden">
    <div class="flex justify-between items-center mt-1.5"><span id="photo-status" class="text-xs text-slate-500"></span>
      <button type="button" id="photo-remove" class="${src ? '' : 'hidden'} text-xs font-semibold text-red-600 hover:underline">Hapus foto</button></div></div>`;
}
function bindPhotoField() {
  const inp = $('#photo-input'), prev = $('#photo-preview'), empty = $('#photo-empty'), rm = $('#photo-remove'), st = $('#photo-status');
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    st.textContent = 'Memproses foto…';
    try {
      const data = await compressImage(f);
      formPhoto.data = data; formPhoto.changed = true;
      prev.src = data; prev.classList.remove('hidden'); empty.classList.add('hidden'); rm.classList.remove('hidden');
      st.textContent = `Foto siap (${Math.round(data.length * 0.75 / 1024)} KB, sudah dikompres)`;
    } catch (e) { st.textContent = ''; toast(e.message, 'error'); }
    inp.value = '';
  });
  rm.addEventListener('click', () => {
    formPhoto.data = null; formPhoto.changed = true;
    prev.src = ''; prev.classList.add('hidden'); empty.classList.remove('hidden'); rm.classList.add('hidden'); st.textContent = 'Foto akan dihapus saat disimpan';
  });
}
async function resolvePhoto() {
  if (!formPhoto.changed) return formPhoto.ref;
  await removePhoto(formPhoto.ref);
  return formPhoto.data ? await storePhoto(formPhoto.data) : null;
}
const formBtns = label => `<div class="flex gap-2 pt-2 sticky bottom-0 bg-white pb-1"><button type="button" data-act="close-modal" class="btn btn-ghost flex-1 sm:flex-none">Batal</button><button type="submit" class="btn btn-primary flex-1">${label}</button></div>`;
function lockSubmit(form) { const b = form.querySelector('[type=submit]'); b.disabled = true; b.innerHTML = 'Menyimpan…'; }

function download(name, content, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

  const rows = [['Tanggal','Jenis','Kategori','Penerima/Toko','Deskripsi','Pemasukan','Pengeluaran','Ada Nota']];
  [...state.finance].sort((a, b) => a.date.localeCompare(b.date)).forEach(f => rows.push([f.date, f.type === 'in' ? 'Pemasukan' : 'Pengeluaran', f.category, f.party, f.desc, f.type === 'in' ? f.amount : '', f.type === 'out' ? f.amount : '', f.photo ? 'Ya' : 'Tidak']));
  download(`keuangan-${slug()}-${today()}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
  toast('File CSV diunduh (bisa dibuka di Excel)');
}
async function backup() {
  const photos = PhotoDB.db ? await PhotoDB.all() : {};
  download(`backup-${slug()}-${today()}.json`, JSON.stringify({ app: 'proyekRumah', version: 1, exportedAt: new Date().toISOString(), state, photos }), 'application/json');
  toast('Backup diunduh — simpan file ini di tempat aman');
}
async function restore(file) {
  try {
    const j = JSON.parse(await file.text());
    if (j.app !== 'proyekRumah' || !j.state) throw new Error('File bukan backup aplikasi ini');
    confirmDialog('Pulihkan backup?', `Data saat ini akan diganti dengan backup tanggal ${new Date(j.exportedAt).toLocaleString('id-ID')}.`, async () => {
      if (PhotoDB.db) { await PhotoDB.clear(); for (const k in photoCache) delete photoCache[k]; for (const [k, v] of Object.entries(j.photos || {})) { await PhotoDB.put(k, v); photoCache[k] = v; } }
      state = j.state; save(); renderAll(); toast('Backup berhasil dipulihkan');
    }, 'Pulihkan');
  } catch (e) { toast(e.message || 'File backup tidak valid', 'error'); }
}
async function resetTo(newState, msg) {
  if (PhotoDB.db) { try { await PhotoDB.clear(); } catch {} }
  for (const k in photoCache) delete photoCache[k];
  state = newState; save(); renderAll(); toast(msg);
}

/* =========================================================
   Event delegation
   ========================================================= */
const ACTIONS = {
  tab: el => showTab(el.dataset.id),
  menu: () => $('#menu').classList.toggle('hidden'),
  settings: openSettings,
  print: printReport, csv: exportCSV, backup,
  restore: () => $('#restore-input').click(),
  'load-demo': () => confirmDialog('Muat data contoh?', 'Semua data saat ini akan diganti dengan data contoh. Lakukan backup dulu bila perlu.', () => resetTo(buildMock(), 'Data contoh dimuat'), 'Muat'),
  wipe: () => confirmDialog('Hapus semua data?', 'Semua absensi, progress, transaksi dan foto akan dihapus permanen dari perangkat ini.', () => resetTo(emptyState(), 'Semua data dihapus'), 'Hapus Semua'),
  'start-fresh': () => confirmDialog('Mulai proyek baru?', 'Data contoh akan dikosongkan, lalu Anda bisa mengisi pengaturan proyek sendiri.', async () => { await resetTo(emptyState(), 'Data contoh dikosongkan'); openSettings(); }, 'Kosongkan'),
  fab: () => ({ absensi: openAttForm, progress: openProgForm, keuangan: openFinForm })[currentTab]?.(),
  'add-att': () => openAttForm(), 'edit-att': el => { closeModal(); openAttForm(el.dataset.id); }, 'del-att': el => delRecord('attendance', el.dataset.id, 'absensi'),
  'add-prog': () => openProgForm(), 'edit-progress': el => { closeLightbox(); openProgForm(el.dataset.id); }, 'del-progress': el => delRecord('progress', el.dataset.id, 'progress'),
  'add-fin': () => openFinForm(), 'edit-fin': el => { closeModal(); openFinForm(el.dataset.id); }, 'del-fin': el => delRecord('finance', el.dataset.id, 'transaksi'),
  'detail-fin': el => openFinDetail(el.dataset.id),
  'prog-filter': el => { progFilter = el.dataset.id; renderProgress(); },
  'fin-type': el => { finFilter.type = el.dataset.id; renderKeuangan(); },
  'view-att': el => { const a = state.attendance.find(x => x.id === el.dataset.id); openLightbox([{ src: photoSrc(a.photo), caption: `<p class="font-bold">Absensi ${fmtDLong(a.date)}</p><p class="text-slate-300">${esc(a.mandor)} • ${a.workers} pekerja hadir</p><p class="text-slate-400 text-xs mt-1">${esc(a.notes)}</p>` }]); },
  'view-nota': el => { const f = state.finance.find(x => x.id === el.dataset.id); openLightbox([{ src: photoSrc(f.photo), caption: `<p class="font-bold">${esc(f.party)} — ${rp(f.amount)}</p><p class="text-slate-300">${fmtDLong(f.date)} • ${esc(f.category)}</p><p class="text-slate-400 text-xs mt-1">${esc(f.desc)}</p>` }]); },
  'view-prog': el => { progFilter = 'Semua'; const i = filteredProgress().findIndex(p => p.id === el.dataset.id); openProgLightbox(i); },
  'lb-prog': el => openProgLightbox(+el.dataset.i),
  'lb-close': closeLightbox, 'lb-prev': () => lbStep(-1), 'lb-next': () => lbStep(1),
  'close-modal': closeModal,
  'confirm-no': () => { $('#confirm').classList.add('hidden'); confirmCb = null; },
  'confirm-yes': () => { $('#confirm').classList.add('hidden'); const cb = confirmCb; confirmCb = null; cb && cb(); },
};
function openProgLightbox(i) {
  const items = filteredProgress().filter(p => photoSrc(p.photo));
  const all = filteredProgress(); const target = all[i];
  const idx = Math.max(0, items.findIndex(p => p === target));
  if (!items.length) return toast('Belum ada foto untuk ditampilkan', 'error');
  openLightbox(items.map(p => ({ src: photoSrc(p.photo), progressId: p.id,
    caption: `<div class="flex items-center gap-2 mb-1">${tahapBadge(p.category)}<span class="badge bg-brand text-navy">${p.percent}%</span><span class="text-slate-400 text-xs">${fmtDLong(p.date)}</span></div><p class="text-slate-200">${esc(p.desc)}</p>` })), idx);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!e.target.closest('#menu') && !e.target.closest('[data-act=menu]')) $('#menu').classList.add('hidden');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  e.preventDefault(); if (el.closest('#menu')) $('#menu').classList.add('hidden');
  fn(el);
});
document.addEventListener('keydown', e => {
  if (!$('#lightbox').classList.contains('hidden')) {
    if (e.key === 'Escape') closeLightbox(); if (e.key === 'ArrowLeft') lbStep(-1); if (e.key === 'ArrowRight') lbStep(1); return;
  }
  if (e.key === 'Escape') { if (!$('#confirm').classList.contains('hidden')) ACTIONS['confirm-no'](); else closeModal(); }
});
(() => { // swipe di lightbox
  let x0 = null; const st = $('#lb-stage');
  st.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  st.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1); x0 = null; });
})();
$('#restore-input').addEventListener('change', e => { const f = e.target.files[0]; if (f) restore(f); e.target.value = ''; });
document.querySelectorAll('.menu-item').forEach(b => b.className = 'menu-item w-full flex items-center gap-3 px-4 py-2.5 text-sm font-medium hover:bg-slate-50 text-left ' + (b.classList.contains('text-red-600') ? 'text-red-600' : ''));
window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));

/* =========================================================
   Init
   ========================================================= */
(async function init() {
  hydrateIcons();
  await PhotoDB.open();
  if (PhotoDB.db) { try { Object.assign(photoCache, await PhotoDB.all()); } catch {} }
  state = load();
  if (!state) { state = buildMock(); save(); }
  renderAll();
  showTab(location.hash.slice(1) || 'dashboard');
})();
</script>
</body>
</html>
